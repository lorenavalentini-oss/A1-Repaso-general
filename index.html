<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Courses · A1 Practice Studio — Improved</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fd;color:#17334b;font:16px/1.55 system-ui,Arial}header{background:linear-gradient(110deg,#093d78,#098db6);color:white;padding:22px max(18px,calc((100vw - 1080px)/2))}header h1{margin:3px 0;font-size:clamp(25px,4vw,36px)}header p{margin:4px 0}main{max-width:1080px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:180px 1fr;gap:18px}nav{position:sticky;top:12px;align-self:start;background:white;border-radius:16px;padding:10px;box-shadow:0 4px 15px #19354a13}button,select{font:inherit}button{cursor:pointer;border:1px solid #b8d3e5;background:#edf6fd;color:#125184;padding:9px 13px;border-radius:10px;font-weight:650}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eab84e}nav button{width:100%;margin:3px 0;text-align:left}nav button.active,.primary{background:#1263a0;color:white}.card{background:white;border-radius:17px;padding:22px;margin-bottom:16px;box-shadow:0 4px 20px #17334b12}h2{margin:0 0 8px;color:#125184}h3{color:#125184;margin:15px 0 8px}.muted{color:#557087}.badge{display:inline-block;border-radius:30px;padding:4px 10px;background:#dff5f7;color:#075778;font-size:13px;font-weight:700}.grammar{background:#eaf6ff;border-left:5px solid #168fbe;padding:15px;border-radius:10px}.model{background:#f0edff;border-radius:12px;padding:15px;white-space:pre-line}.q{padding:14px 0;border-bottom:1px solid #e2ebf2}.q strong{display:block;margin-bottom:8px}.options,.actions{display:flex;gap:8px;flex-wrap:wrap}.options button.correct{background:#d8f6e3;border-color:#27955b;color:#12542d}.options button.wrong{background:#ffe4e2;border-color:#d45d57;color:#812b29}.feedback{font-size:14px;margin-top:6px;font-weight:600}.progress{height:10px;background:#e4edf4;border-radius:12px;overflow:h I never ___ clients on Sunday.", "opts": ["meeting", "meet", "meets"], "answer": 1, "round": 1}, {"q": "___ do you work?", "opts": ["Where", "Does", "Are"], "answer": 0, "round": 1}, {"q": "Do you have lunch at work?", "opts": ["Yes, I am.", "Yes, I does.", "Yes, I do."], "answer": 2, "round": 1}, {"q": "I ___ home at six.", "opts": ["getting", "get", "gets"], "answer": 1, "round": 1}, {"q": "Choose the natural routine.", "opts": ["I always am late.", "I am always late.", "I late always."], "answer": 1}, {"q": "Complete: “I ___ to work by bus.”", "opts": ["go", "goes", "going"], "answer": 0}, {"q": "Choose the correct time expression.", "opts": ["at Friday", "in Friday", "on Friday"], "answer": 2}], "dialog": ["What do you do at work?", "I check emails and meet clients.", "Do you have meetings every day?", "No, I don’t. I usually have meetings on Mondays.", "What time do you start work?", "I start at nine o’clock."], "prompts": ["Describe your working day from morning to evening.", "Ask and answer five questions about a colleague’s routine."]}, {"name": "Unit 2", "topic": "My company and department", "grammar": "Simple present third person · does/doesn’t · company types · departments", "questions": [{"q": "My company ___ software.", "opts": ["produces", "produce", "producing"], "answer": 0, "round": 1}, {"q": "She ___ in Finance.", "opts": ["work", "working", "works"], "answer": 2, "round": 1}, {"q": "___ your company export products?", "opts": ["Is", "Does", "Do"], "answer": 1, "round": 1}, {"q": "It ___ sell cars.", "opts": ["doesn’t", "don’t", "isn’t"], "answer": 0, "round": 1}, {"q": "Does she work in IT?", "opts": ["Yes, she do.", "Yes, she is.", "Yes, she does."], "answer": 2, "round": 1}, {"q": "The Sales department ___ products.", "opts": ["selling", "sells", "sell"], "answer": 1, "round": 1}, {"q": "The IT department ___ computer systems.", "opts": ["manages", "manage", "managing"], "answer": 0, "round": 1}, {"q": "The company ___ 200 people.", "opts": ["employ", "employing", "employs"], "answer": 2, "round": 1}, {"q": "He ___ to work at seven.", "opts": ["go", "goes", "gos"], "answer": 1, "round": 1}, {"q": "She ___ English at work.", "opts": ["studies", "studys", "study"], "answer": 0, "round": 1}, {"q": "Where ___ he work?", "opts": ["do", "is", "does"], "answer": 2, "round": 1}, {"q": "What ___ your company do?", "opts": ["is", "does", "do"], "answer": 1, "round": 1}, {"q": "Choose the correct company description.", "opts": ["It make mobile apps.", "It makes mobile apps.", "It making mobile apps."], "answer": 1}, {"q": "Complete: “Our HR team ___ new employees.”", "opts": ["hire", "hires", "hiring"], "answer": 1}, {"q": "Choose the correct question.", "opts": ["Does he manage the team?", "Do he manage the team?", "Does he manages the team?"], "answer": 0}], "dialog": ["What does your company do?", "It provides financial services.", "Does it have an IT department?", "Yes, it does.", "Where do you work?", "I work in the Finance department."], "prompts": ["Introduce your company: industry, products, employees and departments.", "Explain what three departments do."]}, {"name": "Unit 3", "topic": "Emails and schedules", "grammar": "Documents · email verbs · be going to · plans versus routines", "questions": [{"q": "I ___ going to send an email.", "opts": ["am", "is", "are"], "answer": 0, "round": 1}, {"q": "She ___ going to call the client.", "opts": ["are", "am", "is"], "answer": 2, "round": 1}, {"q": "___ you going to print the report?", "opts": ["Does", "Are", "Do"], "answer": 1, "round": 1}, {"q": "We aren’t going to ___ tomorrow.", "opts": ["meet", "meets", "meeting"], "answer": 0, "round": 1}, {"q": "I need an ___ to request payment.", "opts": ["CV", "business card", "invoice"], "answer": 2, "round": 1}, {"q": "A ___ is useful when you apply for a job.", "opts": ["invoice", "CV", "receipt"], "answer": 1, "round": 1}, {"q": "Please ___ the file to the email.", "opts": ["attach", "attaches", "attaching"], "answer": 2, "round": 1}, {"q": "___ you help me, please?", "opts": ["Are", "Could", "Does"], "answer": 1, "round": 1}, {"q": "Can I ___ by credit card?", "opts": ["pay", "pays", "paying"], "answer": 0, "round": 1}, {"q": "Could you ___ me a different size?", "opts": ["brings", "bringing", "bring"], "answer": 2, "round": 1}, {"q": "What ___ do you need?", "opts": ["sizes", "size", "sized"], "answer": 1, "round": 1}, {"q": "How much ___ it?", "opts": ["is", "does", "are"], "answer": 0, "round": 1}, {"q": "Do you have it ___ blue?", "opts": ["on", "at", "in"], "answer": 2, "round": 1}, {"q": "Can I help you?", "opts": ["Yes, I am.", "Yes, please.", "Yes, I do."], "answer": 1, "round": 1}, {"q": "Choose a polite request.", "opts": ["Give me a discount.", "Could you tell me the price, please?", "You tell price."], "answer": 1}, {"q": "Complete: “The new phone is easy to ___.”", "opts": ["use", "uses", "using"], "answer": 0}, {"q": "Which word describes a product that is easy to carry?", "opts": ["heavy", "portable", "expensive"], "answer": 1}], "dialog": ["Hello, can I help you?", "Yes, please. I’m looking for a laptop.", "What do you need it for?", "I need it for work. Do you have a small model?", "Of course. This model is light and affordable.", "Great! Could I pay by credit card?"], "prompts": ["Present a new product: features, quality, price, colors and use.", "Act as a shop assistant: offer help, ask needs and explain the price."]}];let current=0;let answers={},notes={};let selectedVoice='';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=i=>current+':'+i;
const tips=[['I am / You are / She is','I am an engineer. · Are you from Chile? · She isn’t a manager.'],['I / you / we / they + base verb','I start at nine. · Do you work on Mondays? · I don’t work on Sundays.'],['He / she / it + verb-s','She works in Finance. · Does he work in Sales? · He doesn’t work in IT.'],['am / is / are + going to + base verb','We are going to meet tomorrow. · Are you going to send the invoice?'],['Can / Could + subject + base verb','Could you help me, please? · First, we test the product. Finally, we launch it.']];

function save(){let t=$('notes');if(t)notes[current]=t.value}function go(i){save();speechSynthesis?.cancel();current=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let u=U[current],count=u.questions.filter((q,i)=>key(i) in answers).length,correct=u.questions.filter((q,i)=>answers[key(i)]===q.answer).length;$('nav').innerHTML=U.map((x,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${esc(x.name)}</button>`).join('')+'<button onclick="go(5)" class="'+(current===5?'active':'')+'">Final Review</button>';
if(current===5){review();return}let d=u.dialog;$('content').innerHTML=`<section class="card"><span class="badge">${esc(u.name)} · A1</span><h2>${esc(u.topic)}</h2><p class="muted">${esc(u.grammar)}</p><div class="progress"><div class="bar" style="width:${100*count/u.questions.length}%"></div></div><p class="small muted">${count}/${u.questions.length} answered · ${correct} correct</p></section><section class="card"><h2>1 · Grammar in focus</h2><div class="grammar"><strong>${esc(tips[current][0])}</strong><p>${esc(tips[current][1])}</p></div></section><section class="card"><h2>2 · Listen & understand</h2><div class="model">${esc(d.map((s,i)=>(i%2?'B: ':'A: ')+s).join('\n'))}</div><div class="actions"><button onclick="speak(false)">🔊 Listen</button><button onclick="speak(true)">🐢 Slow</button><button onclick="speechSynthesis.cancel()">■ Stop</button><select id="voice" aria-label="English voice" onchange="selectedVoice=this.value"></select></div><p class="small muted">Audio uses your browser’s available English voices.</p></section><section class="card"><h2>3 · Complete the conversation</h2><p>Choose the response that makes sense in context.</p>${d.map((s,i)=>i%2===0?`<div class="dialog"><b>A:</b> ${esc(s)}</div>`:`<div class="dialog"><b>B:</b> <select id="d${i}" aria-label="Response ${i}"><option value="">Choose a response…</option>${[s,'I’m sorry, could you repeat that?','That sounds interesting, thank you.'].sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('')}<div class="actions"><button class="primary" onclick="checkDialog()">Check conversation</button></div><p id="dialogFeedback" role="status"></p></section><section class="card"><h2>4 · Grammar & vocabulary challenge</h2><p class="muted">15 different questions. No repeated rounds. Try to answer before checking the feedback.</p>${u.questions.map((q,j)=>`<div class="q"><strong>${j+1}. ${esc(q.q)}</strong><div class="options">${q.opts.map((o,k)=>`<button id="o${j}_${k}" onclick="choose(${j},${k})">${esc(o)}</button>`).join('')}</div><div class="feedback" id="f${j}" role="status"></div></div>`).join('')}<div class="actions"><button class="primary" onclick="score()">View score</button><button onclick="resetQuiz()">Try again</button></div><p id="score" role="status"></p></section><section class="card"><h2>5 · Real-life mission</h2><p><b>Situation:</b> ${esc(situations[current][0])}</p><details><summary>Show a useful model</summary><div class="grammar">${esc(situations[current][1])}</div></details><h3>Your response</h3><textarea id="notes" placeholder="Write your own response or dialogue here…">${esc(notes[current]||'')}</textarea><div class="actions"><button onclick="save();alert('Your notes are saved until you close or reload this page.')">Save notes</button><button onclick="copyNotes()">Copy my response</button></div><p class="muted small">Read your response aloud twice: first slowly, then naturally.</p></section><section class="card"><div class="actions"><button class="primary" onclick="go(${current+1})">${current===4?'Go to final review':'Next unit →'}</button></div></section>`;u.questions.forEach((q,j)=>{if(key(j) in answers)paint(j,answers[key(j)])});populateVoices()}
function choose(j,k){answers[key(j)]=k;paint(j,k);let u=U[current],n=u.questions.filter((q,i)=>key(i) in answers).length;let b=document.querySelector('.bar');if(b)b.style.width=100*n/u.questions.length+'%'}function paint(j,k){let q=U[current].questions[j];q.opts.forEach((_,i)=>{$('o'+j+'_'+i).className=i===q.answer?'correct':i===k?'wrong':''});$('f'+j).textContent=k===q.answer?'✓ Correct!':'Not quite. Correct answer: '+q.opts[q.answer]}function score(){let q=U[current].questions,n=q.filter((x,j)=>answers[key(j)]===x.answer).length;$('score').textContent=`Your score: ${n}/${q.length} (${Math.round(n/q.length*100)}%). ${n===q.length?'Excellent work!':'Review the feedback and try again.'}`}function resetQuiz(){U[current].questions.forEach((_,j)=>delete answers[key(j)]);render()}function checkDialog(){let d=U[current].dialog,n=0,total=0;d.forEach((s,i)=>{if(i%2){total++;if($('d'+i).value===s)n++}});$('dialogFeedback').textContent=`${n}/${total} correct. ${n===total?'Great! Read the full dialogue aloud.':'Listen to the model and try again.'}`}
function copyNotes(){save();navigator.clipboard?.writeText(notes[current]||'').then(()=>alert('Copied!')).catch(()=>alert('Please select and copy your text.'))}function voices(){return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}function populateVoices(){let e=$('voice');if(!e||!('speechSynthesis'in window))return;let v=voices();e.innerHTML=v.length?v.map(x=>`<option value="${esc(x.voiceURI)}">${esc(x.name)} (${esc(x.lang)})</option>`).join(''):'<option value="">Default English voice</option>';if(selectedVoice&&v.some(x=>x.voiceURI===selectedVoice))e.value=selectedVoice;else selectedVoice=v[0]?.voiceURI||''}if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',populateVoices);function speak(slow){if(!('speechSynthesis'in window))return alert('Speech is not available in this browser.');speechSynthesis.cancel();let v=voices().find(x=>x.voiceURI===selectedVoice),lines=[...U[current].dialog],i=0;function next(){if(i>=lines.length)return;let a=new SpeechSynthesisUtterance(lines[i++]);a.lang=v?.lang||'en-US';if(v)a.voice=v;a.rate=slow?.72:.91;a.onend=()=>setTimeout(next,200);speechSynthesis.speak(a)}next()}
const finalQs=[['A new colleague says “Nice to meet you.” What do you say?',['Nice to meet you, too.','I am meeting you.','Yes, I do.'],0],['Your manager asks about your routine.',['I checking emails.','I check emails every morning.','I am check emails.'],1],['What does your company do?',['It provides services.','It provide services.','It providing services.'],0],['You have a plan for tomorrow.',['I going to call her.','I am going call her.','I am going to call her.'],2],['You want to ask for help politely.',['Could you help me, please?','You help me now.','Does you help me?'],0],['Choose the correct sentence.',['She don’t work on Fridays.','She doesn’t work on Fridays.','She isn’t work on Fridays.'],1],['Choose the correct time phrase.',['at Monday','on Monday','in Monday'],1],['Choose the correct question.',['Does the company sell laptops?','Do the company sells laptops?','Does the company sells laptops?'],0],['Complete: “We ___ going to send the invoice.”',['is','are','am'],1],['Complete: “Could I ___ by card?”',['pay','paying','pays'],0]];let finalAnswers={};function review(){$('content').innerHTML=`<section class="card"><span class="badge">Intro + Units 1–4</span><h2>Final Review · Use your English</h2><p>10 mixed questions with new contexts. No questions copied from the unit quizzes.</p>${finalQs.map((q,i)=>`<div class="q"><strong>${i+1}. ${esc(q[0])}</strong><div class="options">${q[1].map((o,j)=>`<button id="r${i}_${j}" onclick="answerFinal(${i},${j})">${esc(o)}</button>`).join('')}</div><div class="feedback" id="rf${i}" role="status"></div></div>`).join('')}<div class="actions"><button class="primary" onclick="finalScore()">Check my final score</button><button onclick="finalAnswers={};review()">Restart review</button></div><p id="finalScore" role="status"></p></section><section class="card"><h2>Final speaking challenge</h2><p>Introduce yourself, describe your routine, explain what your company does, describe one plan for next week, and make a polite request.</p><p class="muted">Speak for 60–90 seconds using your own information.</p><button onclick="go(0)">← Back to Intro</button></section>`;Object.entries(finalAnswers).forEach(([i,j])=>paintFinal(+i,j))}function answerFinal(i,j){finalAnswers[i]=j;paintFinal(i,j)}function paintFinal(i,j){let q=finalQs[i];q[1].forEach((_,k)=>{$('r'+i+'_'+k).className=k===q[2]?'correct':k===j?'wrong':''});$('rf'+i).textContent=j===q[2]?'✓ Correct!':'Correct answer: '+q[1][q[2]]}function finalScore(){let n=finalQs.filter((q,i)=>finalAnswers[i]===q[2]).length;$('finalScore').textContent=`Final score: ${n}/${finalQs.length} (${n*10}%).`};render();</script></body></html>
